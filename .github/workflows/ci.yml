---
name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun ci

      - name: Generate exports
        run: bun run generate-exports

      - name: Check types
        run: bun run check-types

      - name: Check formatting
        run: bun run fmt --check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check package
        run: bun run check-package
